services:
  - type: web
    name: idea2impact-api
    runtime: node
    rootDir: .
    buildCommand: npm install && npx prisma generate --schema server/prisma/schema.prisma && npx prisma db push --schema server/prisma/schema.prisma --accept-data-loss && node server/prisma/db-setup.js
    startCommand: npm run start -w server
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: PORT
        value: 10000
