services:
  - type: web
    name: idea2impact-api
    runtime: node
    rootDir: .
    buildCommand: npm install && npx prisma generate --schema server/prisma/schema.prisma
    startCommand: npm run start -w server
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
