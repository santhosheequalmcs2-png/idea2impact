<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Brand Gradient: Royal Purple to Electric Blue -->
    <linearGradient id="i2i-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7041C7" />
      <stop offset="45%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#2563FF" />
    </linearGradient>

    <!-- Inner Glow Gradient -->
    <linearGradient id="i2i-spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>

    <!-- Drop Shadow for crisp visibility on any browser tab -->
    <filter id="i2i-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base with Light Lavender Border -->
  <rect x="8" y="8" width="112" height="112" rx="30" fill="url(#i2i-bg)" stroke="#B99AFF" stroke-width="3" filter="url(#i2i-shadow)"/>

  <!-- Inner Ambient Glow Ring -->
  <rect x="12" y="12" width="104" height="104" rx="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- Primary Innovation Spark (Center-Left) -->
  <path d="M 54 26 C 54 44, 54 44, 34 54 C 54 64, 54 64, 54 82 C 54 64, 54 64, 74 54 C 54 44, 54 44, 54 26 Z" fill="url(#i2i-spark)"/>

  <!-- Core Brilliant Center Dot -->
  <circle cx="54" cy="54" r="3.5" fill="#FFFFFF"/>

  <!-- Dynamic Upward Impact Arrow (2-to-Impact Trajectory) -->
  <path d="M 40 92 Q 68 90 84 68" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <polyline points="72,66 86,66 86,80" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Secondary Satellite Spark (Top-Right) -->
  <path d="M 90 26 C 90 32, 90 32, 84 35 C 90 38, 90 38, 90 44 C 90 38, 90 38, 96 35 C 90 32, 90 32, 90 26 Z" fill="#B99AFF"/>
</svg>
